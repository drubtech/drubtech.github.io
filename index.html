<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drub Tech</title>
<meta name="description" content="Drub Tech: apps sencillas y útiles. Creadores de Vatio, la app que mide a qué velocidad carga tu móvil.">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #eef0f2; --card: #ffffff; --text: #23272c; --muted: #5b626b; --accent: #3f7389; --line: #d3d7dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1418; --card: #142227; --text: #f1f3f4; --muted: #9da3aa; --accent: #5ee2cd; --line: #243840; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 34px; margin: 0 0 4px; letter-spacing: -0.5px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .app { display: flex; gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 20px; margin-top: 28px; text-decoration: none; color: inherit; }
  .app img { width: 72px; height: 72px; border-radius: 18px; flex: none; }
  .app h2 { margin: 0; font-size: 22px; }
  .app p { margin: 2px 0 0; }
  footer { margin-top: 48px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Drub Tech</h1>
  <p class="muted">Apps sencillas y útiles, sin anuncios y sin vender tus datos.</p>

  <a class="app" href="vatio/">
    <img src="vatio/icono.png" alt="Icono de Vatio">
    <div>
      <h2>Vatio</h2>
      <p class="muted">Mira a qué velocidad carga tu móvil y descubre si falla el cable o el cargador.</p>
    </div>
  </a>

  <footer class="muted">© 2026 Drub Tech</footer>
</main>
</body>
</html>
